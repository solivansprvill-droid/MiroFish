name: Build Android APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 🔐 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build APK
        run: |
          # 使用 eas build 命令并开启 --wait 以等待构建完成
          # --local 模式在 CI 环境中通常不可行，因为需要 Android SDK 环境
          # 我们使用云端构建并下载产物
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --output=./mirofish.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirofish-android-apk
          path: ./mirofish.apk
          if-no-files-found: error
