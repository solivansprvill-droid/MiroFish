name: EAS Workflow Build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  run_eas_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 🔐 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build APK and Wait
        id: build
        run: |
          # 触发构建并等待完成，获取构建 ID
          # 注意：--output 仅支持本地构建，云端构建需要先获取 URL 再下载
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📥 Download APK
        run: |
          # 获取最新的构建下载链接并下载
          # 使用 eas build:list 获取最新的成功构建
          BUILD_URL=$(npx eas-cli@latest build:list --platform android --status finished --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          curl -L $BUILD_URL -o ./mirofish.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirofish-android-apk
          path: ./mirofish.apk
          if-no-files-found: error
