name: EAS Workflow Build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  run_eas_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 🔐 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Run EAS Workflow
        run: npx eas-cli@latest workflow:run .eas/workflows/create-production-builds.yml --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
