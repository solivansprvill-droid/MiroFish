name: EAS Workflow Build

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  run_eas_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.12.0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 🔐 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📚 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build APK and Wait
        id: build
        run: |
          # 使用 eas build --wait 模式，这样 GitHub Actions 会等待构建完成
          # 并通过 --output 指定下载路径
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --output=./mirofish.apk
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirofish-android-apk
          path: ./mirofish.apk
          if-no-files-found: error
